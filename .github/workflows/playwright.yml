name: DoneHai Playwright CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 02:00 IST nightly regression
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Tagged suite to run
        required: true
        type: choice
        options: [regression, smoke]
        default: regression

permissions:
  contents: read

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Type-check
        run: npm run typecheck

      - name: Test deployment safety scripts
        run: npm run test:st-ci

  e2e:
    name: E2E (${{ github.event_name == 'pull_request' && 'smoke' || inputs.suite || 'regression' }})
    needs: checks
    # Fork PRs have no access to the staging secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # All runs share one fixed-OTP staging account, so never run two at once.
    concurrency:
      group: donehai-st-test-account
      cancel-in-progress: false

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      TEST_IDENTIFIER: ${{ secrets.TEST_IDENTIFIER }}
      TEST_OTP: ${{ secrets.TEST_OTP }}
      HEADLESS: "true"
      SLOW_MO: "0"
      CI: "true"
      SUITE: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.suite || 'regression' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare environment file
        shell: bash
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$TEST_IDENTIFIER" ] || [ -z "$TEST_OTP" ]; then
            echo "Error: BASE_URL, TEST_IDENTIFIER and TEST_OTP GitHub Secrets are required."
            exit 1
          fi
          cp .env.example .env
          echo "Environment configured."

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run ${{ env.SUITE }} tests
        run: npx playwright test tests/attendance/ tests/tour/ --grep "@${SUITE}" --project=chromium

      - name: Publish Test Results
        if: always()
        run: node scripts/github-summary.cjs

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-${{ env.SUITE }}-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Test Results and Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ env.SUITE }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
